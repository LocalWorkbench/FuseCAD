name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Keep in sync with CONTRIBUTING.md.
  CLANG_FORMAT_VERSION: 23.1.3
  APT_BASE: cmake ninja-build g++ nlohmann-json3-dev doctest-dev
  APT_OCCT: libocct-data-exchange-dev

jobs:
  format:
    name: clang-format
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v5
      - name: Check formatting
        run: git ls-files '*.cpp' '*.h' | xargs pipx run --spec "clang-format==$CLANG_FORMAT_VERSION" clang-format --dry-run --Werror

  core:
    name: Core (Linux, no OCCT/Qt)
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v5
      - name: Install dependencies
        run: sudo apt-get update -qq && sudo apt-get install -y -qq $APT_BASE
      - run: cmake --preset core-only
      - run: cmake --build --preset core-only
      - run: ctest --preset core-only

  linux:
    name: Linux (OCCT + Qt app)
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v5
      - name: Install dependencies
        run: sudo apt-get update -qq && sudo apt-get install -y -qq $APT_BASE $APT_OCCT qt6-base-dev libgl-dev
      - run: cmake --preset dev
      - run: cmake --build --preset dev
      - run: ctest --preset dev

  sanitizers:
    name: Linux (headless, ASan + UBSan)
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v5
      - name: Install dependencies
        run: sudo apt-get update -qq && sudo apt-get install -y -qq $APT_BASE $APT_OCCT
      - run: cmake --preset asan
      - run: cmake --build --preset asan
      - run: ctest --preset asan

  tidy:
    name: clang-tidy
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v5
      - name: Install dependencies
        run: sudo apt-get update -qq && sudo apt-get install -y -qq $APT_BASE $APT_OCCT qt6-base-dev libgl-dev clang clang-tidy
      - name: Configure
        run: cmake --preset dev -DCMAKE_CXX_COMPILER=clang++
      - name: Generate Qt sources
        run: cmake --build --preset dev --target fusecad_autogen
      - name: Run clang-tidy
        run: run-clang-tidy -p build/dev -quiet -warnings-as-errors='*' "$PWD/(src|apps|tests)/"

  macos:
    name: macOS (OCCT + Qt app)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5
      - name: Install dependencies
        run: brew install ninja opencascade qt nlohmann-json doctest
      - run: cmake --preset dev
      - run: cmake --build --preset dev
      - run: ctest --preset dev
